name: polybot-paper

on:
  schedule:
    - cron: "7,37 * * * *"   # about every 30 min (GitHub may run a few minutes late)
  workflow_dispatch: {}       # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: polybot-paper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install requests anthropic python-dotenv

      - name: Run one cycle (paper money only)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODE: paper
        run: python -m polybot run

      - name: Save state and report to the repo
        if: always()
        run: |
          git config user.name "polybot"
          git config user.email "polybot@users.noreply.github.com"
          git add data/paper
          git diff --cached --quiet && exit 0
          git commit -m "paper run $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1

  tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests anthropic python-dotenv pytest && python -m pytest -q
